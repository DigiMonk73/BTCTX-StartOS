# Runs in DigiMonk73/BTCTX-StartOS (the mirror of BTCTX-MCP's startos/).
# Inert inside BTCTX-MCP, where .github/workflows/ci.yml runs the same checks.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check startos
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: node --no-deprecation scripts/check-manifest.mjs
