# Start9's standard workflows (Start9Labs/hello-world-startos), pointed at this
# repository's main branch. They run in DigiMonk73/BTCTX-StartOS, the mirror
# of BTCTX-MCP's startos/, and in Start9's fork of it; inert in BTCTX-MCP.
name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
